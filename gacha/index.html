<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NM4DJ專屬扭蛋球池</title>
<link rel="stylesheet" href="../style.css?v=20260518-fix-alert-v1">
</head>
<body>
<header>
  <h1><span class="mushroom">🍄</span><span class="title-text">NM4DJ專屬扭蛋球池</span><span class="mushroom">🍄</span></h1>
</header>

<div id="winnerMask" class="winner-mask hidden">
  <div class="winner-box">
    <div class="winner-title">🎉 恭喜中獎 🎉</div>
    <div id="winnerPrize" class="winner-prize"></div>
    <div id="winnerName" class="winner-name"></div>
    <div id="winnerTime" class="winner-time"></div>
    <button id="winnerBtn" class="orange" onclick="winnerModalNext()">確認</button>
  </div>
</div>

<div class="container">
  <section id="setupPage">
    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <h2>扭蛋球池｜獎項設定</h2>
        <button class="gray" onclick="location.href='../'">回工具首頁</button>
      </div>
      <p class="small">此設定只屬於扭蛋球池，不會影響其他工具。</p>
      <div class="row">
        <button class="orange" onclick="addPrize()">新增獎項</button>
        <button class="gray" onclick="resetPrizes()">恢復預設獎項</button>
        <button class="red" onclick="clearPrizeRecords()">清空獎項已抽紀錄</button>
      </div>
      <table class="prize-table">
        <thead><tr><th style="width:45%">獎項名稱</th><th style="width:20%">名額</th><th style="width:20%">已抽</th><th style="width:15%">操作</th></tr></thead>
        <tbody id="prizeBody"></tbody>
      </table>
    </div>

    <div class="panel">
      <h2>扭蛋球池｜名單設定</h2>
      <p class="small">名單有幾位，就會在畫面中生成幾顆球。點球才會開獎。</p>
      <div class="row">
        <span>名單數量：</span>
        <input id="totalInput" type="number" value="60" min="1" style="width:120px">
        <button class="orange" onclick="generateList(true)">重新生成名單</button>
      </div>
      <hr>
      <div class="row">
        <span>快速勾選：</span>
        <input id="rangeStart" type="number" value="1" min="1" style="width:100px">
        <span>到</span>
        <input id="rangeEnd" type="number" value="60" min="1" style="width:100px">
        <button onclick="selectRange()">套用範圍</button>
        <button class="gray" onclick="selectAll()">全選</button>
        <button class="gray" onclick="unselectAll()">全取消</button>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="gray" onclick="clearNames()">清空名稱</button>
        <button class="gray" onclick="clearWeights()">權重重設為 1</button>
        <button class="purple" onclick="buildBallPool()">生成扭蛋球池</button>
      </div>
      <div id="listGrid" class="list-grid"></div>
    </div>
  </section>

  <section id="poolPage" class="hidden">
    <div class="panel">
      <div class="row" style="justify-content:center">
        <span>目前獎項：</span>
        <select id="prizeSelect" onchange="changePrize()" style="min-width:220px"></select>
        <span>抽取數量：</span>
        <input id="drawCount" type="number" value="1" min="1" style="width:110px">
        <label><input id="noRepeat" type="checkbox"> 不重複中獎</label>
      </div>
      <div id="prizeSummary" style="text-align:center;margin-top:10px"></div>
      <div class="ballpool-toolbar">
        <button class="orange" onclick="mixBalls()">🌀 攪動球</button>
        <button class="gray" onclick="settleBalls()">讓球停下</button>
        <button class="red" onclick="clearRecords()">清除抽獎紀錄</button>
        <button class="blue" onclick="backToSetup()">關閉球池</button>
      </div>
    </div>

    <div class="main-gacha">
      <div class="ballpool-area">
        <div id="poolStatus" class="ballpool-status">請先攪動球，再直接點選任一顆球開獎。</div>
        <div id="ballStage" class="ballpool-stage">
          <div class="ballpool-floor"></div>
          <div id="poolFlash" class="ballpool-open-flash"></div>
        </div>
        
      </div>

      <div class="result-box">
        <div class="small">本次抽獎結果</div>
        <div id="resultTitle" class="big-result">尚未抽獎</div>
        <p id="resultSub">請攪動球後，手動點選扭蛋球</p>
        <div id="currentResult" class="record">尚無本次結果</div>
        <h3>已抽出的球</h3>
        <div id="winnerBalls" class="winner-balls-tray">尚無</div>
        <h3>抽獎紀錄</h3>
        <div id="records" class="record">尚無紀錄</div>
      </div>
    </div>
  </section>
</div>

<script src="../common.js"></script>
<script>
requireAuth();

const state={
  total:60,
  participants:[],
  active:[],
  balls:[],
  records:[],
  prizes:defaultPrizes(),
  drawTotal:0,
  winners:[],
  prizeId:null,
  isMixing:false,
  anim:null,
  lastTime:0,
  audio:null
};

const ballColors=[
  "#f87171","#fbbf24","#34d399","#60a5fa","#c084fc",
  "#f472b6","#fb923c","#a3e635","#22d3ee","#fda4af"
];

function renderPrizes(){
  const body=document.getElementById("prizeBody");
  body.innerHTML="";
  state.prizes.forEach(p=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td><input value="${escapeAttr(p.name)}" oninput="updatePrizeName('${p.id}',this.value)"></td>
      <td><input type="number" min="1" value="${p.quota}" oninput="updatePrizeQuota('${p.id}',this.value)"></td>
      <td>${p.drawn} / ${p.quota}</td>
      <td><button class="red" onclick="deletePrize('${p.id}')">刪除</button></td>
    `;
    body.appendChild(tr);
  });
}

function updatePrizeName(id,v){
  const p=state.prizes.find(x=>x.id===id);
  if(p)p.name=v.trim()||"未命名獎項";
}

function updatePrizeQuota(id,v){
  const p=state.prizes.find(x=>x.id===id);
  if(!p)return;
  p.quota=Number(v)>0?Number(v):1;
  if(p.drawn>p.quota)p.drawn=p.quota;
  renderPrizes();
}

function addPrize(){
  state.prizes.push({id:makeId(),name:`獎項 ${state.prizes.length+1}`,quota:1,drawn:0});
  renderPrizes();
}

function deletePrize(id){
  if(state.prizes.length<=1)return alert("至少需要保留一個獎項。");
  if(confirm("確定刪除此獎項？")){
    state.prizes=state.prizes.filter(p=>p.id!==id);
    renderPrizes();
  }
}

function resetPrizes(){
  if(confirm("確定恢復預設獎項？")){
    state.prizes=defaultPrizes();
    renderPrizes();
  }
}

function clearPrizeRecords(){
  if(confirm("確定清空所有獎項已抽數量？")){
    state.prizes.forEach(p=>p.drawn=0);

    // 重置本輪抽獎狀態，避免跳出「已達上限」
    state.winners=[];
    state.drawTotal=0;
    state.prizeId=null;

    renderPrizes();
    renderPrizeSelect();
    updatePrizeSummary();

    document.getElementById("resultTitle").textContent="尚未抽獎";
    document.getElementById("resultSub").textContent="獎項紀錄已清空，可以重新開始抽獎";
    document.getElementById("currentResult").textContent="尚無本次結果";

    const tray=document.getElementById("winnerBalls");
    if(tray) tray.textContent="尚無";

    document.getElementById("poolStatus").textContent="獎項已重置，可重新攪動球並開始抽獎。";
  }
}

function generateList(confirmAsk){
  const n=Number(document.getElementById("totalInput").value);
  if(!n||n<1)return alert("名單數量至少要 1");
  if(confirmAsk&&state.participants.length>0&&!confirm("重新生成會清空目前名稱與權重，確定嗎？"))return;
  state.total=n;
  state.participants=[];
  for(let i=1;i<=n;i++)state.participants.push({number:i,checked:true,name:"",weight:""});
  document.getElementById("rangeEnd").value=n;
  renderList();
}

function renderList(){
  const box=document.getElementById("listGrid");
  box.innerHTML="";
  state.participants.forEach(p=>{
    const div=document.createElement("div");
    div.className="item"+(p.checked?" checked":"");
    div.id=`item_${p.number}`;
    div.innerHTML=`
      <div class="item-top">
        <input type="checkbox" id="check_${p.number}" ${p.checked?"checked":""} onchange="syncItem(${p.number})">
        <strong>No.${p.number}</strong>
      </div>
      <label>名稱</label>
      <input type="text" id="name_${p.number}" value="${escapeAttr(p.name)}" placeholder="未填則使用 ${p.number}" oninput="syncItem(${p.number})">
      <label>權重</label>
      <input type="number" id="weight_${p.number}" value="${escapeAttr(p.weight)}" min="0" placeholder="1" oninput="syncItem(${p.number})">
    `;
    box.appendChild(div);
  });
}

function saveInputs(){
  state.participants.forEach(p=>{
    const n=document.getElementById(`name_${p.number}`);
    const w=document.getElementById(`weight_${p.number}`);
    const c=document.getElementById(`check_${p.number}`);
    if(n)p.name=n.value;
    if(w)p.weight=w.value;
    if(c)p.checked=c.checked;
  });
}

function syncItem(num){
  const p=state.participants.find(x=>x.number===num);
  p.checked=document.getElementById(`check_${num}`).checked;
  p.name=document.getElementById(`name_${num}`).value;
  p.weight=document.getElementById(`weight_${num}`).value;
  document.getElementById(`item_${num}`).classList.toggle("checked",p.checked);
}

function selectRange(){
  saveInputs();
  const s=Number(document.getElementById("rangeStart").value);
  const e=Number(document.getElementById("rangeEnd").value);
  if(!s||!e||s>e)return alert("請輸入正確範圍");
  state.participants.forEach(p=>p.checked=p.number>=s&&p.number<=e);
  renderList();
}

function selectAll(){saveInputs();state.participants.forEach(p=>p.checked=true);renderList()}
function unselectAll(){saveInputs();state.participants.forEach(p=>p.checked=false);renderList()}
function clearNames(){if(confirm("確定清空全部名稱？")){saveInputs();state.participants.forEach(p=>p.name="");renderList()}}
function clearWeights(){if(confirm("確定將全部權重重設為 1？")){saveInputs();state.participants.forEach(p=>p.weight="");renderList()}}

function selected(){
  saveInputs();
  return state.participants
    .filter(p=>p.checked)
    .map(p=>({
      number:p.number,
      name:p.name.trim()||String(p.number),
      weight:Number(p.weight)>0?Number(p.weight):1
    }));
}

function buildBallPool(){
  state.active=selected();
  if(!state.active.length)return alert("請至少勾選一個號碼");
  document.getElementById("setupPage").classList.add("hidden");
  document.getElementById("poolPage").classList.remove("hidden");
  renderPrizeSelect();
  requestAnimationFrame(()=>setTimeout(createBalls,120));
  window.scrollTo({top:0,behavior:"smooth"});
}

function backToSetup(){
  stopAnimation();
  document.getElementById("poolPage").classList.add("hidden");
  document.getElementById("setupPage").classList.remove("hidden");
  renderList();
  renderPrizes();
}

function renderPrizeSelect(){
  const s=document.getElementById("prizeSelect");
  s.innerHTML="";
  state.prizes.forEach(p=>{
    const r=Math.max(p.quota-p.drawn,0);
    const o=document.createElement("option");
    o.value=p.id;
    o.textContent=`${p.name}｜剩餘 ${r} / ${p.quota}`;
    o.disabled=r<=0;
    s.appendChild(o);
  });
  const f=state.prizes.find(p=>p.quota-p.drawn>0);
  if(f)s.value=f.id;
  changePrize();
}

function prize(){
  return state.prizes.find(p=>p.id===document.getElementById("prizeSelect").value);
}

function changePrize(){
  const p=prize();
  if(!p)return;
  document.getElementById("drawCount").value=Math.max(p.quota-p.drawn,0)||1;
  updatePrizeSummary();
}

function updatePrizeSummary(){
  document.getElementById("prizeSummary").innerHTML=state.prizes.map(p=>
    `<span class="prize-badge">🥚 ${escapeHtml(p.name)}｜已抽 ${p.drawn} / ${p.quota}｜剩餘 ${Math.max(p.quota-p.drawn,0)}</span>`
  ).join("");
}

function createBalls(){
  const stage=document.getElementById("ballStage");
  [...stage.querySelectorAll(".pick-ball")].forEach(x=>x.remove());
  const tray=document.getElementById("winnerBalls");
  if(tray)tray.textContent="尚無";

  const rect=stage.getBoundingClientRect();
  const size=window.innerWidth<=900?52:64;
  const cx=rect.width/2;
  const cy=rect.height/2;
  const poolRadius=Math.min(rect.width,rect.height)/2 - size/2 - 18;
  const placed=[];

  state.balls=state.active.map((p,i)=>{
    const el=document.createElement("div");
    el.className="pick-ball";
    el.textContent="";
    el.title="神秘扭蛋球";
    el.dataset.number=p.number;
    el.onclick=()=>openBall(p.number);

    const color=ballColors[i%ballColors.length];
    el.style.setProperty("--ballMain",color);

    let x=cx-size/2;
    let y=cy-size/2;
    let ok=false;

    for(let attempt=0;attempt<1200;attempt++){
      const angle=Math.random()*Math.PI*2;
      const radius=Math.sqrt(Math.random())*poolRadius;
      const rx=cx+Math.cos(angle)*radius-size/2;
      const ry=cy+Math.sin(angle)*radius-size/2;

      ok=true;
      for(const other of placed){
        const dx=rx-other.x;
        const dy=ry-other.y;
        const minDist=size*0.96;
        if(Math.sqrt(dx*dx+dy*dy)<minDist){
          ok=false;
          break;
        }
      }

      if(ok){
        x=rx;
        y=ry;
        break;
      }
    }

    if(!ok){
      const ring=Math.floor(i/10)+1;
      const angle=(i*137.5%360)*Math.PI/180;
      const radius=Math.min(poolRadius,ring*size*.82);
      x=cx+Math.cos(angle)*radius-size/2;
      y=cy+Math.sin(angle)*radius-size/2;
    }

    const ball={
      participant:p,
      el,
      x,
      y,
      vx:0,
      vy:0,
      size,
      opened:false
    };

    placed.push(ball);

    el.style.left=ball.x+"px";
    el.style.top=ball.y+"px";
    stage.appendChild(el);
    return ball;
  });

  document.getElementById("resultTitle").textContent="尚未抽獎";
  document.getElementById("resultSub").textContent="請攪動球後，手動點選扭蛋球";
  document.getElementById("poolStatus").innerHTML=`已生成 <strong>${state.balls.length}</strong> 顆神秘扭蛋球，圓形球池內可自由彈跳，請任選一顆開獎。`;
}

function mixBalls(){
  unlockAudio(state);
  const count=Number(document.getElementById("drawCount").value);
  const p=prize();

  if(!p)return alert("請選擇獎項。");
  if(p.quota-p.drawn<=0)return alert("此獎項已抽完，請選擇其他獎項。");
  if(!count||count<1)return alert("抽取數量至少為 1");
  if(count>p.quota-p.drawn)return alert(`此獎項剩餘名額只有 ${p.quota-p.drawn} 位。`);

  document.getElementById("poolStatus").textContent="球正在彈跳攪動中，球面不顯示號碼，請憑直覺選一顆。";
  document.getElementById("resultTitle").textContent="攪動中...";
  document.getElementById("resultSub").textContent="所有扭蛋球正在隨機滾動。";

  state.isMixing=true;

  state.balls.forEach(ball=>{
    if(ball.opened)return;

    const angle=Math.random()*Math.PI*2;
    const power=620+Math.random()*920;

    ball.vx+=Math.cos(angle)*power;
    ball.vy+=Math.sin(angle)*power;
    ball.el.classList.add("shaking");
  });

  state.lastTime=performance.now();
  if(!state.anim)state.anim=requestAnimationFrame(stepPhysics);

  setTimeout(()=>{
    state.isMixing=false;
    state.balls.forEach(ball=>ball.el.classList.remove("shaking"));
    document.getElementById("poolStatus").textContent="攪動結束，球會自然落下停在底部；可以點選任一顆開獎。";
  },1200);
}

function settleBalls(){
  state.isMixing=false;
  state.balls.forEach(ball=>{
    ball.vx*=.18;
    ball.vy*=.18;
    ball.el.classList.remove("shaking");
  });
  document.getElementById("poolStatus").textContent="球已慢慢停下，可以點選任一顆開獎。";
}

function stepPhysics(now){
  const stage=document.getElementById("ballStage");
  const rect=stage.getBoundingClientRect();
  const dt=Math.min((now-state.lastTime)/1000,.03);
  state.lastTime=now;

  const cx=rect.width/2;
  const cy=rect.height/2;
  const poolRadius=Math.min(rect.width,rect.height)/2;
  const bounce=.74;
  const friction=.986;
  const gravity=860;
  let moving=false;

  state.balls.forEach(ball=>{
    if(ball.opened)return;

    // 重力，讓球最後自然落在圓形球池底部
    ball.vy+=gravity*dt;

    ball.x+=ball.vx*dt;
    ball.y+=ball.vy*dt;

    const bx=ball.x+ball.size/2;
    const by=ball.y+ball.size/2;
    let dx=bx-cx;
    let dy=by-cy;
    let dist=Math.sqrt(dx*dx+dy*dy) || .001;
    const maxDist=poolRadius-ball.size/2-16;

    if(dist>maxDist){
      const nx=dx/dist;
      const ny=dy/dist;

      ball.x=cx+nx*maxDist-ball.size/2;
      ball.y=cy+ny*maxDist-ball.size/2;

      const dot=ball.vx*nx+ball.vy*ny;
      if(dot>0){
        ball.vx-=2*dot*nx;
        ball.vy-=2*dot*ny;
        ball.vx*=bounce;
        ball.vy*=bounce;
      }

      // 底部摩擦：貼近下緣時慢慢停下
      if(ny>.62){
        ball.vx*=.93;
        ball.vy*=.82;
      }
    }
  });

  // 球與球碰撞，避免重疊
  for(let i=0;i<state.balls.length;i++){
    const a=state.balls[i];
    if(a.opened)continue;

    for(let j=i+1;j<state.balls.length;j++){
      const b=state.balls[j];
      if(b.opened)continue;

      const ax=a.x+a.size/2;
      const ay=a.y+a.size/2;
      const bx=b.x+b.size/2;
      const by=b.y+b.size/2;
      let dx=bx-ax;
      let dy=by-ay;
      let dist=Math.sqrt(dx*dx+dy*dy) || .001;
      const minDist=(a.size+b.size)*.5;

      if(dist<minDist){
        const nx=dx/dist;
        const ny=dy/dist;
        const overlap=minDist-dist;

        a.x-=nx*overlap*.5;
        a.y-=ny*overlap*.5;
        b.x+=nx*overlap*.5;
        b.y+=ny*overlap*.5;

        const dvx=b.vx-a.vx;
        const dvy=b.vy-a.vy;
        const impact=dvx*nx+dvy*ny;

        if(impact<0){
          const impulse=impact*.86;
          a.vx+=impulse*nx;
          a.vy+=impulse*ny;
          b.vx-=impulse*nx;
          b.vy-=impulse*ny;
        }
      }
    }
  }

  state.balls.forEach(ball=>{
    if(ball.opened)return;

    // 再次限制在圓形內
    const bx=ball.x+ball.size/2;
    const by=ball.y+ball.size/2;
    let dx=bx-cx;
    let dy=by-cy;
    let dist=Math.sqrt(dx*dx+dy*dy) || .001;
    const maxDist=poolRadius-ball.size/2-16;

    if(dist>maxDist){
      const nx=dx/dist;
      const ny=dy/dist;
      ball.x=cx+nx*maxDist-ball.size/2;
      ball.y=cy+ny*maxDist-ball.size/2;
    }

    ball.vx*=friction;
    ball.vy*=friction;

    if(Math.abs(ball.vx)>2.5||Math.abs(ball.vy)>2.5)moving=true;

    ball.el.style.left=ball.x+"px";
    ball.el.style.top=ball.y+"px";
    ball.el.style.transform=`rotate(${(ball.x+ball.y)%360}deg)`;
  });

  if(moving||state.isMixing){
    state.anim=requestAnimationFrame(stepPhysics);
  }else{
    state.anim=null;
    state.balls.forEach(ball=>ball.el.classList.remove("shaking"));
  }
}

function stopAnimation(){
  state.isMixing=false;
  if(state.anim){
    cancelAnimationFrame(state.anim);
    state.anim=null;
  }
}

function openBall(number){
  const p=prize();
  if(!p)return alert("請選擇獎項。");

  const count=Number(document.getElementById("drawCount").value);
  const remain=p.quota-p.drawn;

  if(remain<=0)return alert("此獎項已抽完，請選擇其他獎項。");
  if(!count||count<1)return alert("抽取數量至少為 1");
  if(count>remain)return alert(`此獎項剩餘名額只有 ${remain} 位。`);

  if(state.winners.length>=count){
    return alert("本次抽取數量已達上限，請按確認後再進行下一輪。");
  }

  const ball=state.balls.find(b=>b.participant.number===number);
  if(!ball||ball.opened)return;

  state.prizeId=p.id;
  state.drawTotal=count;

  ball.opened=true;

  const winner=ball.participant;
  state.winners.push(winner);

  const flash=document.getElementById("poolFlash");
  flash.style.left=(ball.x+ball.size/2)+"px";
  flash.style.top=(ball.y+ball.size/2)+"px";
  flash.classList.remove("burst");
  void flash.offsetWidth;
  flash.classList.add("burst");

  flyBallToWinnerTray(ball);
  playOpenSound();

  setTimeout(()=>showWinner(winner),620);
}


function flyBallToWinnerTray(ball){
  const tray=document.getElementById("winnerBalls");
  const sourceRect=ball.el.getBoundingClientRect();
  const trayRect=tray.getBoundingClientRect();

  if(tray.textContent.trim()==="尚無"){
    tray.textContent="";
  }

  const clone=document.createElement("div");
  clone.className="flying-ball";
  clone.style.width=sourceRect.width+"px";
  clone.style.height=sourceRect.height+"px";
  clone.style.left=sourceRect.left+"px";
  clone.style.top=sourceRect.top+"px";
  clone.style.setProperty("--ballMain",ball.el.style.getPropertyValue("--ballMain") || "#fbbf24");
  document.body.appendChild(clone);

  ball.el.classList.add("opened");

  requestAnimationFrame(()=>{
    clone.style.left=(trayRect.left+trayRect.width/2-23)+"px";
    clone.style.top=(trayRect.top+trayRect.height/2-23)+"px";
    clone.style.transform="scale(.58) rotate(720deg)";
    clone.style.opacity=".92";
  });

  setTimeout(()=>{
    clone.remove();
    addMiniWinnerBall(ball);
  },780);
}

function addMiniWinnerBall(ball){
  const tray=document.getElementById("winnerBalls");
  if(!tray)return;

  if(tray.textContent.trim()==="尚無"){
    tray.textContent="";
  }

  const mini=document.createElement("div");
  mini.className="winner-mini-ball";
  mini.title=ball.participant.name;
  mini.style.setProperty("--ballMain",ball.el.style.getPropertyValue("--ballMain") || "#fbbf24");
  tray.appendChild(mini);
}


function showWinner(winner){
  const p=state.prizes.find(x=>x.id===state.prizeId);
  const now=new Date().toLocaleString("zh-TW",{hour12:false});

  document.getElementById("winnerPrize").textContent=p?`🥚 ${p.name}`:"";
  document.getElementById("winnerName").textContent=state.drawTotal===1
    ?`第 1 位：${winner.name}`
    :`第 ${state.winners.length} 位：${winner.name}`;
  document.getElementById("winnerTime").textContent=`開獎時間：${now}`;
  document.getElementById("winnerBtn").textContent=state.winners.length<state.drawTotal?"下一顆":"確認";
  document.getElementById("winnerMask").classList.remove("hidden");
}

function winnerModalNext(){
  document.getElementById("winnerMask").classList.add("hidden");

  if(state.winners.length<state.drawTotal){
    document.getElementById("poolStatus").textContent=`已開出 ${state.winners.length} 顆，請繼續點選下一顆。`;
    document.getElementById("resultTitle").textContent="繼續開球";
    document.getElementById("resultSub").textContent=`還需要再開 ${state.drawTotal-state.winners.length} 顆`;
    return;
  }

  finish();
}

function finish(){
  const noRepeat=document.getElementById("noRepeat").checked;
  const p=state.prizes.find(x=>x.id===state.prizeId);
  const name=p?p.name:"未命名獎項";
  const text=state.winners.map((w,i)=>`第 ${i+1} 位：${w.name}（${w.number}號）`).join("\n");
  const time=new Date().toLocaleString("zh-TW",{hour12:false});
  const code=makeVerifyCode(`${time}|${name}|${JSON.stringify(state.winners)}|${state.active.length}`);

  document.getElementById("resultTitle").textContent="恭喜中獎";
  document.getElementById("resultSub").textContent=`${name}｜本次開出 ${state.winners.length} 位`;
  document.getElementById("currentResult").textContent=text;

  state.records.unshift(`${time}\n【${name}】\n${text}\n公平性驗證碼：${code}`);
  renderRecords();

  if(p){
    p.drawn+=state.winners.length;
    if(p.drawn>p.quota)p.drawn=p.quota;
  }

  if(noRepeat){
    const set=new Set(state.winners.map(x=>x.number));
    state.active=state.active.filter(x=>!set.has(x.number));
    state.participants.forEach(p=>{
      if(set.has(p.number))p.checked=false;
    });
  }

  state.winners=[];
  renderPrizeSelect();
  updatePrizeSummary();
  renderPrizes();

  if(noRepeat){
    createBalls();
  }else{
    state.balls.forEach(ball=>{
      ball.opened=false;
      ball.el.classList.remove("opened");
    });
  }

  document.getElementById("poolStatus").textContent="本輪完成，球面仍保持隱藏，可再次攪動球或直接點選下一輪。";
}

function renderRecords(){
  document.getElementById("records").textContent=state.records.length
    ?state.records.map((x,i)=>`${i+1}. ${x}`).join("\n\n")
    :"尚無紀錄";
}

function clearRecords(){
  if(confirm("確定清除抽獎紀錄？")){
    state.records=[];
    renderRecords();
  }
}

function playOpenSound(){
  try{
    unlockAudio(state);
    const t=state.audio.currentTime;

    const osc1=state.audio.createOscillator();
    const gain1=state.audio.createGain();
    osc1.type="triangle";
    osc1.frequency.setValueAtTime(520,t);
    osc1.frequency.exponentialRampToValueAtTime(1180,t+.18);
    gain1.gain.setValueAtTime(.045,t);
    gain1.gain.exponentialRampToValueAtTime(.001,t+.28);
    osc1.connect(gain1);
    gain1.connect(state.audio.destination);
    osc1.start(t);
    osc1.stop(t+.3);

    const osc2=state.audio.createOscillator();
    const gain2=state.audio.createGain();
    osc2.type="sine";
    osc2.frequency.setValueAtTime(1560,t+.08);
    gain2.gain.setValueAtTime(.025,t+.08);
    gain2.gain.exponentialRampToValueAtTime(.001,t+.38);
    osc2.connect(gain2);
    gain2.connect(state.audio.destination);
    osc2.start(t+.08);
    osc2.stop(t+.4);
  }catch(e){}
}

renderPrizes();
generateList(false);
</script>
</body>
</html>
