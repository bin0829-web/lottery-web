<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NM4DJ專屬抽獎工具</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="lock" class="lock">
  <div class="panel lock-box">
    <h1><span class="mushroom">🍄</span><span class="title-text">NM4DJ專屬抽獎工具</span><span class="mushroom">🍄</span></h1>
    <p>請先輸入密碼</p>
    <input id="passwordInput" type="password" placeholder="請輸入密碼">
    <br>
    <button class="login-btn" onclick="login()">進入</button>
    <p id="passwordMsg" class="small"></p>
  </div>
</div>

<header>
  <h1><span class="mushroom">🍄</span><span class="title-text">NM4DJ專屬抽獎工具</span><span class="mushroom">🍄</span></h1>
</header>

<div class="container">
  <section id="homePage">
    <div class="panel">
      <h2>請選擇抽獎工具</h2>
      <p class="small">目前已開放幸運轉盤與扭蛋機，兩個工具資料完全獨立。</p>
      <div class="tool-grid">
        <a class="tool-card" href="wheel/">
          <h2>🎡 幸運轉盤</h2>
          <p>轉盤動畫、停止控制、分界柱答答聲、獎項、權重、紀錄。</p>
        </a>
        <a class="tool-card" href="gacha/">
          <h2>🥚 扭蛋機</h2>
          <p>扭蛋機搖晃、掉球動畫、獎項、權重、紀錄。</p>
        </a>
        <div class="tool-card disabled">
          <h2>🎲 隨機抽人</h2>
          <p>之後可新增：不使用動畫，快速抽名單。</p>
        </div>
        <div class="tool-card disabled">
          <h2>🎁 獎箱抽獎</h2>
          <p>之後可新增：開箱動畫與獎池模式。</p>
        </div>
      </div>
    </div>
  </section>
</div>

<script src="common.js"></script>
<script>initLogin();</script>
</body>
</html>
