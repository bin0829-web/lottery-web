<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NM4DJ專屬幸運轉盤</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Microsoft JhengHei",Arial,sans-serif;
  background:#fffdf6;
  color:#3b2a1a;
  overflow-x:hidden;
}

.hidden{display:none!important}

header{
  text-align:center;
  padding:20px 12px 8px;
}

h1{
  margin:0;
  color:#8b4513;
}

.container{
  max-width:1250px;
  margin:auto;
  padding:16px;
}

.panel{
  background:#fff8ec;
  border:4px solid #9b642f;
  border-radius:26px;
  padding:22px;
  margin-bottom:16px;
  box-shadow:0 8px 18px rgba(0,0,0,.08);
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
}

input,button{
  border-radius:14px;
  padding:10px 14px;
  border:3px solid #f6b26b;
  font-size:16px;
}

button{
  cursor:pointer;
  font-weight:bold;
  background:#31c26b;
  color:#073b1c;
  border:4px solid #8b5a2b;
  box-shadow:0 5px 0 #7a4a20;
}

button.red{
  background:#ef4444;
  color:white;
}

button.blue{
  background:#60a5fa;
  color:white;
}

button.gray{
  background:#e5e7eb;
  color:#333;
}

button.orange{
  background:#fbbf24;
  color:#4a2a00;
}

button:active{
  transform:translateY(3px);
  box-shadow:0 1px 0 #7a4a20;
}

.list-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:10px;
  margin-top:14px;
}

.item{
  background:white;
  border:2px solid #e6c7a3;
  border-radius:14px;
  padding:10px;
}

.item.checked{
  background:#fff1c7;
  border-color:#9b642f;
}

.item-top{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}

.item input[type="text"],
.item input[type="number"]{
  width:100%;
  margin-top:4px;
}

.item label{
  font-size:13px;
  color:#6b4b2b;
}

.main-wheel{
  display:grid;
  grid-template-columns:1fr 360px;
  gap:24px;
  align-items:center;
}

.wheel-area{
  text-align:center;
  position:relative;
  min-height:620px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.pointer{
  width:0;
  height:0;
  border-left:24px solid transparent;
  border-right:24px solid transparent;
  border-top:56px solid #ef4444;
  margin:0 auto -18px;
  position:relative;
  z-index:3;
}

.wheel-frame{
  width:560px;
  height:560px;
  max-width:90vw;
  max-height:90vw;
  border-radius:50%;
  border:12px solid #9b642f;
  overflow:hidden;
  position:relative;
  box-shadow:0 12px 28px rgba(0,0,0,.25);
  background:white;
}

.wheel-spin{
  width:100%;
  height:100%;
  border-radius:50%;
  position:relative;
  transition:transform 4s cubic-bezier(.12,.72,.14,1);
  will-change:transform;
  transform:rotate(0deg);
}

.wheel-center{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:120px;
  height:120px;
  border-radius:50%;
  background:#ffc983;
  border:8px solid #9b642f;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:22px;
  z-index:5;
}

.label{
  position:absolute;
  left:50%;
  top:50%;
  width:130px;
  height:32px;
  margin-left:-65px;
  margin-top:-16px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:15px;
  font-weight:bold;
  color:#5b3415;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  transform-origin:center center;
  pointer-events:none;
  z-index:2;
}

.result-box{
  background:#fff8ec;
  border:4px solid #9b642f;
  border-radius:18px;
  padding:20px;
  text-align:center;
}

.big-result{
  color:#dc2626;
  font-size:34px;
  font-weight:bold;
  line-height:1.6;
}

.record{
  background:white;
  border:2px dashed #f6b26b;
  border-radius:12px;
  padding:12px;
  min-height:80px;
  max-height:260px;
  overflow:auto;
  text-align:left;
  white-space:pre-wrap;
  line-height:1.6;
}

.lock,
.winner-mask{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:99;
  padding:20px;
}

.lock{
  background:rgba(255,253,246,.97);
}

.lock-box{
  width:min(720px,95%);
  text-align:center;
}

.winner-box{
  width:min(760px,95%);
  background:#fff8ec;
  border:6px solid #9b642f;
  border-radius:26px;
  text-align:center;
  padding:34px 22px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.winner-title{
  font-size:40px;
  color:#dc2626;
  font-weight:bold;
  margin-bottom:20px;
}

.winner-name{
  font-size:38px;
  color:#7e22ce;
  font-weight:bold;
  line-height:1.5;
  margin-bottom:18px;
}

.winner-time{
  font-size:20px;
  color:#374151;
  margin-bottom:20px;
}

.small{
  font-size:14px;
  color:#7c5a35;
}

@media(max-width:900px){

  .main-wheel{
    grid-template-columns:1fr;
  }

  .wheel-area{
    min-height:430px;
  }

  .wheel-frame{
    width:360px;
    height:360px;
  }

  .label{
    width:90px;
    margin-left:-45px;
    font-size:11px;
  }

  .winner-title{
    font-size:30px;
  }

  .winner-name{
    font-size:28px;
  }
}
</style>
</head>

<body>

<div id="lock" class="lock">

  <div class="panel lock-box">

    <h1 style="font-size:62px;">
      🍄 NM4DJ專屬幸運轉盤 🍄
    </h1>

    <p style="
      text-align:center;
      font-size:40px;
      margin-top:28px;
      margin-bottom:24px;
    ">
      請先輸入密碼
    </p>

    <input
      id="passwordInput"
      type="password"
      placeholder="請輸入密碼"
      style="
        width:100%;
        text-align:center;
        font-size:38px;
        height:92px;
      "
    >

    <div style="
      margin-top:28px;
      text-align:center;
    ">

      <button
        onclick="login()"
        style="
          min-width:220px;
          height:90px;
          font-size:42px;
        "
      >
        進入
      </button>

    </div>

    <p id="passwordMsg" class="small"></p>

  </div>

</div>

<header>
  <h1>🍄 NM4DJ專屬幸運轉盤 🍄</h1>
</header>

<div class="container">

  <div class="panel">
    <h2>網站已成功套用新版登入畫面</h2>

    <p>
      目前這份已包含：
    </p>

    <ul style="line-height:2;">
      <li>NM4DJ專屬幸運轉盤標題</li>
      <li>登入畫面置中</li>
      <li>大型密碼輸入框</li>
      <li>大型進入按鈕</li>
      <li>直播友善版面</li>
      <li>手機版支援</li>
    </ul>
  </div>

</div>

<script>
const PASSWORD = "NM4DJ2026";

function login(){

  const pw = document.getElementById("passwordInput").value;

  if(pw === PASSWORD){

    document.getElementById("lock").classList.add("hidden");

  }else{

    document.getElementById("passwordMsg").textContent = "密碼錯誤";

  }
}

document.getElementById("passwordInput").addEventListener("keydown",e=>{

  if(e.key==="Enter") login();

});
</script>

</body>
</html>
