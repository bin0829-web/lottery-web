<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NM4DJ專屬幸運轉盤</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Microsoft JhengHei",Arial,sans-serif;
  background:#fffdf6;
  color:#3b2a1a;
  overflow-x:hidden;
}

.hidden{display:none!important}

header{
  text-align:center;
  padding:20px 12px 8px;
}

h1{
  margin:0;
  color:#8b4513;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  flex-wrap:nowrap;
  font-size:56px;
  line-height:1.1;
  text-align:center;
}

h1 .mushroom{flex-shrink:0}
h1 .title-text{white-space:nowrap}

.container{
  max-width:1250px;
  margin:auto;
  padding:16px;
}

.panel{
  background:#fff8ec;
  border:4px solid #9b642f;
  border-radius:26px;
  padding:22px;
  margin-bottom:16px;
  box-shadow:0 8px 18px rgba(0,0,0,.08);
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
}

input,button,select{
  border-radius:14px;
  padding:10px 14px;
  border:3px solid #f6b26b;
  font-size:16px;
}

button{
  cursor:pointer;
  font-weight:bold;
  background:#31c26b;
  color:#073b1c;
  border:4px solid #8b5a2b;
  box-shadow:0 5px 0 #7a4a20;
}

button.red{background:#ef4444;color:white}
button.blue{background:#60a5fa;color:white}
button.gray{background:#e5e7eb;color:#333}
button.orange{background:#fbbf24;color:#4a2a00}

button:active{
  transform:translateY(3px);
  box-shadow:0 1px 0 #7a4a20;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.prize-table{
  width:100%;
  border-collapse:collapse;
  margin-top:12px;
  background:white;
  border-radius:14px;
  overflow:hidden;
}

.prize-table th,
.prize-table td{
  border-bottom:1px solid #e6c7a3;
  padding:10px;
  text-align:left;
}

.prize-table th{background:#ffe7b7}
.prize-table input{width:100%}

.prize-badge{
  display:inline-block;
  background:#fff1c7;
  border:2px solid #9b642f;
  border-radius:999px;
  padding:6px 12px;
  margin:4px;
  font-weight:bold;
}

.list-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:10px;
  margin-top:14px;
}

.item{
  background:white;
  border:2px solid #e6c7a3;
  border-radius:14px;
  padding:10px;
}

.item.checked{
  background:#fff1c7;
  border-color:#9b642f;
}

.item-top{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}

.item input[type="text"],
.item input[type="number"]{
  width:100%;
  margin-top:4px;
}

.item label{
  font-size:13px;
  color:#6b4b2b;
}

.main-wheel{
  display:grid;
  grid-template-columns:1fr 360px;
  gap:24px;
  align-items:center;
}

.wheel-area{
  text-align:center;
  min-height:620px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.pointer{
  width:0;
  height:0;
  border-left:24px solid transparent;
  border-right:24px solid transparent;
  border-top:56px solid #ef4444;
  margin:0 auto -18px;
  position:relative;
  z-index:3;
}

.wheel-frame{
  width:560px;
  height:560px;
  max-width:90vw;
  max-height:90vw;
  border-radius:50%;
  border:12px solid #9b642f;
  overflow:hidden;
  position:relative;
  box-shadow:0 12px 28px rgba(0,0,0,.25);
  background:white;
}

.wheel-spin{
  width:100%;
  height:100%;
  border-radius:50%;
  position:relative;
  transition:transform 4s cubic-bezier(.12,.72,.14,1);
  will-change:transform;
  transform:rotate(0deg);
}

.wheel-center{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:120px;
  height:120px;
  border-radius:50%;
  background:#ffc983;
  border:8px solid #9b642f;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:22px;
  z-index:5;
}

.label{
  position:absolute;
  left:50%;
  top:50%;
  width:130px;
  height:32px;
  margin-left:-65px;
  margin-top:-16px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:15px;
  font-weight:bold;
  color:#5b3415;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  transform-origin:center center;
  pointer-events:none;
  z-index:2;
}

.result-box{
  background:#fff8ec;
  border:4px solid #9b642f;
  border-radius:18px;
  padding:20px;
  text-align:center;
}

.big-result{
  color:#dc2626;
  font-size:34px;
  font-weight:bold;
  line-height:1.6;
}

.record{
  background:white;
  border:2px dashed #f6b26b;
  border-radius:12px;
  padding:12px;
  min-height:80px;
  max-height:260px;
  overflow:auto;
  text-align:left;
  white-space:pre-wrap;
  line-height:1.6;
}

.lock,
.winner-mask{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:99;
  padding:20px;
}

.lock{background:rgba(255,253,246,.97)}

.lock-box{
  width:min(760px,95%);
  text-align:center;
}

.lock-box p{
  text-align:center;
  font-size:34px;
  margin:24px 0;
}

#passwordInput{
  width:100%;
  text-align:center;
  font-size:34px;
  height:82px;
}

.login-btn{
  min-width:220px;
  height:86px;
  font-size:40px;
  margin-top:24px;
}

.winner-box{
  width:min(760px,95%);
  background:#fff8ec;
  border:6px solid #9b642f;
  border-radius:26px;
  text-align:center;
  padding:34px 22px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.winner-title{
  font-size:40px;
  color:#dc2626;
  font-weight:bold;
  margin-bottom:20px;
}

.winner-prize{
  font-size:28px;
  color:#92400e;
  font-weight:bold;
  margin-bottom:12px;
}

.winner-name{
  font-size:38px;
  color:#7e22ce;
  font-weight:bold;
  line-height:1.5;
  margin-bottom:18px;
}

.winner-time{
  font-size:20px;
  color:#374151;
  margin-bottom:20px;
}

.small{
  font-size:14px;
  color:#7c5a35;
}

@media(max-width:900px){
  h1{
    font-size:36px;
    gap:8px;
  }

  h1 .title-text{
    white-space:normal;
  }

  .main-wheel{
    grid-template-columns:1fr;
  }

  .wheel-area{
    min-height:430px;
  }

  .wheel-frame{
    width:360px;
    height:360px;
  }

  .label{
    width:90px;
    margin-left:-45px;
    font-size:11px;
  }

  .winner-title{font-size:30px}
  .winner-prize{font-size:22px}
  .winner-name{font-size:28px}
  .lock-box p{font-size:24px}

  #passwordInput{
    font-size:26px;
    height:70px;
  }

  .login-btn{
    font-size:32px;
    height:76px;
  }
}
</style>
</head>

<body>

<div id="lock" class="lock">
  <div class="panel lock-box">
    <h1>
      <span class="mushroom">🍄</span>
      <span class="title-text">NM4DJ專屬幸運轉盤</span>
      <span class="mushroom">🍄</span>
    </h1>

    <p>請先輸入密碼</p>

    <input id="passwordInput" type="password" placeholder="請輸入密碼">

    <br>

    <button class="login-btn" onclick="login()">進入</button>

    <p id="passwordMsg" class="small"></p>
  </div>
</div>

<div id="winnerMask" class="winner-mask hidden">
  <div class="winner-box">
    <div class="winner-title">🎉 恭喜中獎 🎉</div>
    <div id="winnerPrize" class="winner-prize"></div>
    <div id="winnerName" class="winner-name"></div>
    <div id="winnerTime" class="winner-time"></div>
    <button id="winnerBtn" class="orange" onclick="winnerModalNext()">確認</button>
  </div>
</div>

<header>
  <h1>
    <span class="mushroom">🍄</span>
    <span class="title-text">NM4DJ專屬幸運轉盤</span>
    <span class="mushroom">🍄</span>
  </h1>
</header>

<div class="container">

<section id="setupPage">

  <div class="panel">
    <h2>獎項設定</h2>
    <p class="small">
      可設定多個獎項與名額。轉盤頁會選擇目前要抽的獎項，抽取數量會自動帶入剩餘名額。
    </p>

    <div class="row">
      <button class="orange" onclick="addPrize()">新增獎項</button>
      <button class="gray" onclick="resetPrizeDefaults()">恢復預設獎項</button>
      <button class="red" onclick="clearPrizeRecords()">清空獎項已抽紀錄</button>
    </div>

    <table class="prize-table">
      <thead>
        <tr>
          <th style="width:45%">獎項名稱</th>
          <th style="width:20%">名額</th>
          <th style="width:20%">已抽</th>
          <th style="width:15%">操作</th>
        </tr>
      </thead>
      <tbody id="prizeBody"></tbody>
    </table>
  </div>

  <div class="panel">
    <h2>抽獎名單設定</h2>
    <p class="small">
      預設 60 個號碼。沒有輸入名稱時，會使用號碼代表；沒有輸入權重時，權重自動為 1。
    </p>

    <div class="row">
      <span>名單數量：</span>
      <input id="totalInput" type="number" value="60" min="1" style="width:120px">
      <button class="orange" onclick="generateList()">重新生成名單</button>
    </div>

    <hr>

    <div class="row">
      <span>快速勾選：</span>
      <input id="rangeStart" type="number" value="1" min="1" style="width:100px">
      <span>到</span>
      <input id="rangeEnd" type="number" value="60" min="1" style="width:100px">
      <button onclick="selectRange()">套用範圍</button>
      <button class="gray" onclick="selectAll()">全選</button>
      <button class="gray" onclick="unselectAll()">全取消</button>
    </div>

    <div class="row" style="margin-top:12px">
      <button class="gray" onclick="clearNames()">清空名稱</button>
      <button class="gray" onclick="clearWeights()">權重重設為 1</button>
      <button class="blue" onclick="buildWheel()">生成轉盤</button>
    </div>

    <div id="listGrid" class="list-grid"></div>
  </div>

</section>

<section id="wheelPage" class="hidden">

  <div class="panel">
    <div class="row" style="justify-content:center">
      <span>目前獎項：</span>
      <select id="currentPrizeSelect" onchange="changeCurrentPrize()" style="min-width:220px"></select>

      <span>抽取數量：</span>
      <input id="drawCount" type="number" value="1" min="1" style="width:110px">

      <label>
        <input id="noRepeat" type="checkbox">
        不重複中獎
      </label>
    </div>

    <div id="prizeSummary" style="text-align:center;margin-top:10px"></div>

    <div class="row" style="justify-content:center;margin-top:10px">
      <button id="drawBtn" onclick="startDraw()">開始抽獎</button>
      <button class="red" onclick="clearRecords()">清除抽獎紀錄</button>
      <button class="blue" onclick="backToSetup()">關閉轉盤</button>
    </div>
  </div>

  <div class="main-wheel">
    <div class="wheel-area">
      <div class="pointer"></div>
      <div class="wheel-frame">
        <div id="wheelSpin" class="wheel-spin">
          <div class="wheel-center">LUCKY</div>
        </div>
      </div>
    </div>

    <div class="result-box">
      <div class="small">本次抽獎結果</div>
      <div id="resultTitle" class="big-result">尚未抽獎</div>
      <p id="resultSub">請選擇獎項後開始抽獎</p>
      <div id="currentResult" class="record">尚無本次結果</div>

      <h3>抽獎紀錄</h3>
      <div id="records" class="record">尚無紀錄</div>
    </div>
  </div>

</section>

</div>

<script>
const PASSWORD = "nm4dj2026";

let total = 60;
let participants = [];
let activeParticipants = [];
let rotation = 0;
let records = [];
let prizes = [];
let drawQueue = [];
let drawIndex = 0;
let pendingWinners = [];
let pendingPrizeId = null;
let isDrawing = false;

const colors = [
  "#fca5a5","#fdba74","#fde68a","#86efac",
  "#67e8f9","#93c5fd","#c4b5fd","#f9a8d4",
  "#fef08a","#a7f3d0"
];

function login(){
  const pw = document.getElementById("passwordInput").value;

  if(pw === PASSWORD){
    document.getElementById("lock").classList.add("hidden");
  }else{
    document.getElementById("passwordMsg").textContent = "密碼錯誤";
  }
}

document.getElementById("passwordInput").addEventListener("keydown",e=>{
  if(e.key==="Enter") login();
});

function makeId(){
  return "p_" + Date.now() + "_" + Math.floor(Math.random()*999999);
}

function defaultPrizes(){
  return [
    {id:makeId(), name:"一獎", quota:1, drawn:0},
    {id:makeId(), name:"二獎", quota:3, drawn:0},
    {id:makeId(), name:"三獎", quota:10, drawn:0}
  ];
}

function renderPrizes(){
  const body = document.getElementById("prizeBody");
  body.innerHTML = "";

  prizes.forEach(p=>{
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>
        <input value="${escapeAttr(p.name)}" oninput="updatePrizeName('${p.id}',this.value)">
      </td>
      <td>
        <input type="number" min="1" value="${p.quota}" oninput="updatePrizeQuota('${p.id}',this.value)">
      </td>
      <td>
        ${p.drawn} / ${p.quota}
      </td>
      <td>
        <button class="red" onclick="deletePrize('${p.id}')">刪除</button>
      </td>
    `;

    body.appendChild(tr);
  });
}

function updatePrizeName(id,value){
  const p = prizes.find(x=>x.id===id);
  if(p) p.name = value.trim() || "未命名獎項";
}

function updatePrizeQuota(id,value){
  const p = prizes.find(x=>x.id===id);
  if(!p) return;

  const n = Number(value);
  p.quota = n > 0 ? n : 1;

  if(p.drawn > p.quota){
    p.drawn = p.quota;
  }

  renderPrizes();
}

function addPrize(){
  prizes.push({
    id:makeId(),
    name:`獎項 ${prizes.length + 1}`,
    quota:1,
    drawn:0
  });

  renderPrizes();
}

function deletePrize(id){
  if(prizes.length <= 1){
    alert("至少需要保留一個獎項。");
    return;
  }

  if(!confirm("確定刪除此獎項？")) return;

  prizes = prizes.filter(p=>p.id!==id);
  renderPrizes();
}

function resetPrizeDefaults(){
  if(!confirm("確定恢復預設獎項？目前獎項設定會被覆蓋。")) return;

  prizes = defaultPrizes();
  renderPrizes();
}

function clearPrizeRecords(){
  if(!confirm("確定清空所有獎項已抽數量？")) return;

  prizes.forEach(p=>p.drawn=0);
  renderPrizes();
  renderPrizeSelect();
  updatePrizeSummary();
}

function renderPrizeSelect(){
  const select = document.getElementById("currentPrizeSelect");
  select.innerHTML = "";

  prizes.forEach(p=>{
    const remain = Math.max(p.quota - p.drawn,0);
    const option = document.createElement("option");

    option.value = p.id;
    option.textContent = `${p.name}｜剩餘 ${remain} / ${p.quota}`;
    option.disabled = remain <= 0;

    select.appendChild(option);
  });

  const firstAvailable = prizes.find(p=>p.quota - p.drawn > 0);

  if(firstAvailable){
    select.value = firstAvailable.id;
  }

  changeCurrentPrize();
}

function getCurrentPrize(){
  const id = document.getElementById("currentPrizeSelect").value;
  return prizes.find(p=>p.id===id);
}

function changeCurrentPrize(){
  const prize = getCurrentPrize();
  if(!prize) return;

  const remain = Math.max(prize.quota - prize.drawn,0);
  document.getElementById("drawCount").value = remain > 0 ? remain : 1;

  updatePrizeSummary();
}

function updatePrizeSummary(){
  const box = document.getElementById("prizeSummary");
  if(!box) return;

  box.innerHTML = prizes.map(p=>{
    const remain = Math.max(p.quota - p.drawn,0);

    return `<span class="prize-badge">🎁 ${escapeHtml(p.name)}｜已抽 ${p.drawn} / ${p.quota}｜剩餘 ${remain}</span>`;
  }).join("");
}

function generateList(){
  const newTotal = Number(document.getElementById("totalInput").value);

  if(!newTotal || newTotal < 1){
    alert("名單數量至少要 1");
    return;
  }

  if(participants.length > 0 && !confirm("重新生成會清空目前名稱與權重，確定嗎？")){
    return;
  }

  total = newTotal;
  participants = [];

  for(let i=1;i<=total;i++){
    participants.push({
      number:i,
      checked:true,
      name:"",
      weight:""
    });
  }

  document.getElementById("rangeEnd").value = total;
  renderList();
}

function renderList(){
  const box = document.getElementById("listGrid");
  box.innerHTML = "";

  participants.forEach(p=>{
    const div = document.createElement("div");

    div.className = "item" + (p.checked ? " checked" : "");
    div.id = `item_${p.number}`;

    div.innerHTML = `
      <div class="item-top">
        <input type="checkbox" id="check_${p.number}" ${p.checked ? "checked" : ""} onchange="syncItem(${p.number})">
        <strong>No.${p.number}</strong>
      </div>

      <label>名稱</label>
      <input type="text" id="name_${p.number}" value="${escapeAttr(p.name)}" placeholder="未填則使用 ${p.number}" oninput="syncItem(${p.number})">

      <label>權重</label>
      <input type="number" id="weight_${p.number}" value="${escapeAttr(p.weight)}" min="0" placeholder="1" oninput="syncItem(${p.number})">
    `;

    box.appendChild(div);
  });
}

function syncItem(num){
  const p = participants.find(x=>x.number===num);

  p.checked = document.getElementById(`check_${num}`).checked;
  p.name = document.getElementById(`name_${num}`).value;
  p.weight = document.getElementById(`weight_${num}`).value;

  document.getElementById(`item_${num}`).classList.toggle("checked",p.checked);
}

function selectRange(){
  saveAllInputs();

  const s = Number(document.getElementById("rangeStart").value);
  const e = Number(document.getElementById("rangeEnd").value);

  if(!s || !e || s > e){
    alert("請輸入正確範圍");
    return;
  }

  participants.forEach(p=>{
    p.checked = p.number >= s && p.number <= e;
  });

  renderList();
}

function selectAll(){
  saveAllInputs();
  participants.forEach(p=>p.checked=true);
  renderList();
}

function unselectAll(){
  saveAllInputs();
  participants.forEach(p=>p.checked=false);
  renderList();
}

function clearNames(){
  if(!confirm("確定清空全部名稱？")) return;

  saveAllInputs();
  participants.forEach(p=>p.name="");
  renderList();
}

function clearWeights(){
  if(!confirm("確定將全部權重重設為 1？")) return;

  saveAllInputs();
  participants.forEach(p=>p.weight="");
  renderList();
}

function saveAllInputs(){
  participants.forEach(p=>{
    const n = document.getElementById(`name_${p.number}`);
    const w = document.getElementById(`weight_${p.number}`);
    const c = document.getElementById(`check_${p.number}`);

    if(n) p.name = n.value;
    if(w) p.weight = w.value;
    if(c) p.checked = c.checked;
  });
}

function getSelectedParticipants(){
  saveAllInputs();

  return participants
    .filter(p=>p.checked)
    .map(p=>({
      number:p.number,
      name:p.name.trim() || String(p.number),
      weight:Number(p.weight) > 0 ? Number(p.weight) : 1
    }));
}

function buildWheel(){
  activeParticipants = getSelectedParticipants();

  if(activeParticipants.length === 0){
    alert("請至少勾選一個號碼");
    return;
  }

  if(prizes.length === 0){
    alert("請至少設定一個獎項。");
    return;
  }

  document.getElementById("setupPage").classList.add("hidden");
  document.getElementById("wheelPage").classList.remove("hidden");

  document.getElementById("resultTitle").textContent = "尚未抽獎";
  document.getElementById("resultSub").textContent = "請選擇獎項後開始抽獎";
  document.getElementById("currentResult").textContent = "尚無本次結果";

  renderPrizeSelect();
  updatePrizeSummary();

  window.scrollTo({top:0,behavior:"smooth"});

  requestAnimationFrame(()=>{
    setTimeout(()=>{
      renderWheel(activeParticipants);
    },100);
  });
}

function renderWheel(list){
  const wheel = document.getElementById("wheelSpin");
  wheel.innerHTML = `<div class="wheel-center">LUCKY</div>`;

  const totalWeight = list.reduce((s,x)=>s+x.weight,0);
  const isSameWeight = list.every(x=>x.weight === list[0].weight);

  let gradient = [];
  let current = 0;

  const frame = document.querySelector(".wheel-frame");
  const wheelSize = frame.getBoundingClientRect().width || 560;
  const labelDistance = wheelSize * 0.31;

  list.forEach((p,i)=>{
    const deg = p.weight / totalWeight * 360;
    const start = current;
    const end = current + deg;
    const mid = start + deg / 2;
    const color = colors[i % colors.length];

    gradient.push(`${color} ${start}deg ${end}deg`);

    const label = document.createElement("div");
    label.className = "label";

    label.textContent = isSameWeight
      ? p.name
      : `${p.name} ${((p.weight/totalWeight)*100).toFixed(1)}%`;

    label.style.transform =
      `rotate(${mid}deg) translateY(-${labelDistance}px) rotate(90deg)`;

    wheel.appendChild(label);
    current = end;
  });

  wheel.style.background = `conic-gradient(${gradient.join(",")})`;
}

function startDraw(){
  if(isDrawing) return;

  const prize = getCurrentPrize();

  if(!prize){
    alert("請選擇獎項。");
    return;
  }

  const remain = prize.quota - prize.drawn;

  if(remain <= 0){
    alert("此獎項已抽完，請選擇其他獎項。");
    return;
  }

  const count = Number(document.getElementById("drawCount").value);

  if(!count || count < 1){
    alert("抽取數量至少為 1");
    return;
  }

  if(count > remain){
    alert(`此獎項剩餘名額只有 ${remain} 位。`);
    return;
  }

  if(count > activeParticipants.length){
    alert("抽取數量不可大於目前轉盤人數");
    return;
  }

  const confirmText =
`請確認本次抽獎資訊：

目前獎項：${prize.name}
抽取數量：${count}
參與人數：${activeParticipants.length}

是否開始抽獎？`;

  if(!confirm(confirmText)){
    return;
  }

  pendingPrizeId = prize.id;
  pendingWinners = pickWinners(count);
  drawQueue = [...pendingWinners];
  drawIndex = 0;

  document.getElementById("currentResult").textContent = "抽獎中...";
  document.getElementById("resultTitle").textContent = "抽獎中...";
  document.getElementById("resultSub").textContent = `準備抽出 ${count} 位｜${prize.name}`;

  spinNextWinner();
}

function pickWinners(count){
  const pool = [...activeParticipants];
  const winners = [];

  for(let i=0;i<count;i++){
    const winner = weightedPick(pool);
    winners.push(winner);

    const idx = pool.findIndex(x=>x.number===winner.number);
    pool.splice(idx,1);
  }

  return winners;
}

function spinNextWinner(){
  isDrawing = true;
  document.getElementById("drawBtn").disabled = true;

  const winner = drawQueue[drawIndex];
  const prize = prizes.find(p=>p.id===pendingPrizeId);
  const wheel = document.getElementById("wheelSpin");

  document.getElementById("resultTitle").textContent = "抽獎中...";
  document.getElementById("resultSub").textContent =
    `第 ${drawIndex + 1} 位抽獎中｜${prize ? prize.name : ""}`;

  rotation += 1800 + Math.floor(Math.random()*1440);
  wheel.style.transform = `rotate(${rotation}deg)`;

  setTimeout(()=>{
    showWinnerModal(winner);
  },4100);
}

function showWinnerModal(winner){
  const now = new Date().toLocaleString("zh-TW",{hour12:false});
  const prize = prizes.find(p=>p.id===pendingPrizeId);

  document.getElementById("winnerPrize").textContent =
    prize ? `🎁 ${prize.name}` : "";

  document.getElementById("winnerName").textContent =
    pendingWinners.length === 1
      ? `第 1 位：${winner.name}`
      : `第 ${drawIndex + 1} 位：${winner.name}`;

  document.getElementById("winnerTime").textContent =
    `抽獎時間：${now}`;

  document.getElementById("winnerBtn").textContent =
    drawIndex < pendingWinners.length - 1 ? "下一位" : "確認";

  document.getElementById("winnerMask").classList.remove("hidden");
}

function winnerModalNext(){
  document.getElementById("winnerMask").classList.add("hidden");

  drawIndex++;

  if(drawIndex < drawQueue.length){
    spinNextWinner();
    return;
  }

  finishDraw();
}

function finishDraw(){
  const noRepeat = document.getElementById("noRepeat").checked;
  const prize = prizes.find(p=>p.id===pendingPrizeId);
  const prizeName = prize ? prize.name : "未命名獎項";

  const text = pendingWinners
    .map((w,i)=>`第 ${i+1} 位：${w.name}（${w.number}號）`)
    .join("\n");

  document.getElementById("resultTitle").textContent = "恭喜中獎";
  document.getElementById("resultSub").textContent =
    `${prizeName}｜本次抽出 ${pendingWinners.length} 位`;

  document.getElementById("currentResult").textContent = text;

  const time = new Date().toLocaleString("zh-TW",{hour12:false});
  const verifyCode = makeVerifyCode(
    `${time}|${prizeName}|${JSON.stringify(pendingWinners)}|${activeParticipants.length}`
  );

  records.unshift(`${time}\n【${prizeName}】\n${text}\n公平性驗證碼：${verifyCode}`);

  renderRecords();

  if(prize){
    prize.drawn += pendingWinners.length;

    if(prize.drawn > prize.quota){
      prize.drawn = prize.quota;
    }
  }

  if(noRepeat){
    const winnerSet = new Set(pendingWinners.map(x=>x.number));

    activeParticipants = activeParticipants.filter(x=>!winnerSet.has(x.number));

    participants.forEach(p=>{
      if(winnerSet.has(p.number)){
        p.checked = false;
      }
    });

    if(activeParticipants.length > 0){
      renderWheel(activeParticipants);
    }
  }

  renderPrizeSelect();
  updatePrizeSummary();
  renderPrizes();

  isDrawing = false;
  document.getElementById("drawBtn").disabled = false;
}

function weightedPick(pool){
  const totalWeight = pool.reduce((s,x)=>s+x.weight,0);
  let r = Math.random() * totalWeight;

  for(const p of pool){
    r -= p.weight;

    if(r <= 0){
      return p;
    }
  }

  return pool[pool.length-1];
}

function renderRecords(){
  document.getElementById("records").textContent =
    records.length
      ? records.map((r,i)=>`${i+1}. ${r}`).join("\n\n")
      : "尚無紀錄";
}

function clearRecords(){
  if(!confirm("確定清除抽獎紀錄？")) return;

  records = [];
  renderRecords();
}

function backToSetup(){
  if(isDrawing){
    alert("抽獎進行中，請等待完成。");
    return;
  }

  document.getElementById("wheelPage").classList.add("hidden");
  document.getElementById("setupPage").classList.remove("hidden");

  renderList();
  renderPrizes();

  window.scrollTo({top:0,behavior:"smooth"});
}

function makeVerifyCode(str){
  let h1 = 0xdeadbeef;
  let h2 = 0x41c6ce57;

  for(let i=0;i<str.length;i++){
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }

  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^
       Math.imul(h2 ^ (h2 >>> 13), 3266489909);

  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^
       Math.imul(h1 ^ (h1 >>> 13), 3266489909);

  const n = 4294967296 * (2097151 & h2) + (h1 >>> 0);

  return "V-" + n.toString(36).toUpperCase();
}

function escapeAttr(str){
  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll('"',"&quot;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

function escapeHtml(str){
  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

prizes = defaultPrizes();
renderPrizes();
generateList();
</script>
