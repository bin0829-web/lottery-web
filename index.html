<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>轉盤抽獎工具</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Microsoft JhengHei",Arial,sans-serif;
  background:linear-gradient(135deg,#07111f,#111827,#020617);
  color:#fff;
}
.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}
header{
  text-align:center;
  padding:28px 12px 12px;
}
h1{margin:0;color:#facc15}
p{color:#94a3b8}
.panel{
  background:#111827;
  border:1px solid #334155;
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
}
.main{
  display:grid;
  grid-template-columns:1fr 360px;
  gap:18px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;
}
.item{
  background:#020617;
  border:1px solid #334155;
  border-radius:12px;
  padding:10px;
}
.item.checked{
  border-color:#facc15;
  background:#1e293b;
}
.item-top{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}
input[type="checkbox"]{
  width:18px;
  height:18px;
}
input[type="text"],input[type="number"],input[type="password"]{
  width:100%;
  padding:9px;
  border-radius:8px;
  border:1px solid #475569;
  background:#020617;
  color:white;
}
label{
  font-size:13px;
  color:#cbd5e1;
}
button{
  border:0;
  border-radius:12px;
  padding:12px 18px;
  background:#facc15;
  color:#111827;
  font-weight:bold;
  cursor:pointer;
  margin:4px;
}
button.secondary{
  background:#334155;
  color:#fff;
}
button.danger{
  background:#ef4444;
  color:#fff;
}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:12px 0;
}
.wheel-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  position:sticky;
  top:16px;
}
.pointer{
  width:0;
  height:0;
  border-left:18px solid transparent;
  border-right:18px solid transparent;
  border-bottom:34px solid #fff;
  margin-bottom:-8px;
  z-index:2;
}
.wheel{
  width:300px;
  height:300px;
  border-radius:50%;
  border:10px solid #facc15;
  background:conic-gradient(
    #ef4444 0deg 45deg,
    #f97316 45deg 90deg,
    #facc15 90deg 135deg,
    #22c55e 135deg 180deg,
    #38bdf8 180deg 225deg,
    #6366f1 225deg 270deg,
    #a855f7 270deg 315deg,
    #ec4899 315deg 360deg
  );
  transition:transform 3.5s cubic-bezier(.12,.72,.14,1);
  position:relative;
  box-shadow:0 0 40px rgba(250,204,21,.25);
}
.wheel:after{
  content:"🎁";
  position:absolute;
  inset:50% auto auto 50%;
  transform:translate(-50%,-50%);
  width:78px;
  height:78px;
  border-radius:50%;
  background:#020617;
  border:5px solid white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
}
.result{
  text-align:center;
  font-size:30px;
  color:#facc15;
  font-weight:bold;
  line-height:1.5;
}
.small{
  font-size:13px;
  color:#94a3b8;
}
.record{
  background:#020617;
  border:1px solid #334155;
  border-radius:12px;
  padding:12px;
  white-space:pre-wrap;
  line-height:1.7;
  max-height:220px;
  overflow:auto;
}
.lock{
  position:fixed;
  inset:0;
  background:rgba(2,6,23,.95);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:99;
  padding:20px;
}
.lock-box{
  width:min(420px,100%);
  background:#111827;
  border:1px solid #334155;
  border-radius:18px;
  padding:22px;
}
.lock-box h2{
  color:#facc15;
  margin-top:0;
}
@media(max-width:850px){
  .main{grid-template-columns:1fr}
  .wheel-wrap{position:static}
  .wheel{width:250px;height:250px}
}
</style>
</head>
<body>

<div id="lock" class="lock">
  <div class="lock-box">
    <h2>🔐 轉盤抽獎工具</h2>
    <p>請輸入密碼後進入。</p>
    <input id="password" type="password" placeholder="請輸入密碼" />
    <div class="actions">
      <button onclick="login()">進入網站</button>
    </div>
    <div id="loginMsg" class="small"></div>
  </div>
</div>

<header>
  <h1>🎡 轉盤抽獎工具</h1>
  <p>勾選號碼、編輯名稱、設定權重後即可抽獎</p>
</header>

<div class="container">
  <div class="main">

    <div>
      <div class="panel">
        <h2>抽獎名單</h2>
        <p class="small">
          預設 60 個號碼。沒有輸入名稱時，會使用號碼作為名稱；沒有輸入權重時，權重自動視為 1。
        </p>

        <div class="actions">
          <button onclick="selectAll()">全選</button>
          <button class="secondary" onclick="unselectAll()">取消全選</button>
          <button class="secondary" onclick="resetNames()">清空名稱</button>
          <button class="secondary" onclick="resetWeights()">權重重設為 1</button>
          <button class="danger" onclick="clearRecords()">清除紀錄</button>
        </div>

        <div id="list" class="grid"></div>
      </div>

      <div class="panel">
        <h2>中獎紀錄</h2>
        <div id="records" class="record">尚無中獎紀錄</div>
      </div>
    </div>

    <div class="panel wheel-wrap">
      <div class="pointer"></div>
      <div id="wheel" class="wheel"></div>

      <button onclick="draw()">開始抽獎</button>
      <button class="secondary" onclick="removeWinnerToggle()">
        <span id="removeText">中獎後保留名單</span>
      </button>

      <div id="result" class="result">等待抽獎</div>
      <div class="small">目前勾選：<span id="countText">0</span> 位</div>
    </div>

  </div>
</div>

<script>
const SITE_PASSWORD = "NM4DJ2026";
const TOTAL = 60;
const STORAGE_KEY = "simple_wheel_lottery_v1";

let rotation = 0;
let removeWinnerAfterDraw = false;

function login(){
  const pw = document.getElementById("password").value;
  if(pw === SITE_PASSWORD){
    document.getElementById("lock").style.display = "none";
  }else{
    document.getElementById("loginMsg").textContent = "密碼錯誤，請重新輸入。";
  }
}

document.getElementById("password").addEventListener("keydown",e=>{
  if(e.key === "Enter") login();
});

function init(){
  const list = document.getElementById("list");
  list.innerHTML = "";

  for(let i=1;i<=TOTAL;i++){
    const div = document.createElement("div");
    div.className = "item checked";
    div.id = "item_" + i;

    div.innerHTML = `
      <div class="item-top">
        <input type="checkbox" id="check_${i}" checked onchange="updateItem(${i})">
        <strong>No.${i}</strong>
      </div>

      <label>名稱</label>
      <input type="text" id="name_${i}" placeholder="未填則使用 ${i}">

      <label>權重</label>
      <input type="number" id="weight_${i}" min="0" placeholder="1">
    `;

    list.appendChild(div);
  }

  loadRecords();
  updateCount();
}

function updateItem(i){
  const checked = document.getElementById("check_" + i).checked;
  document.getElementById("item_" + i).classList.toggle("checked",checked);
  updateCount();
}

function updateCount(){
  const count = getCandidates().length;
  document.getElementById("countText").textContent = count;
}

function getCandidates(){
  const arr = [];

  for(let i=1;i<=TOTAL;i++){
    const checked = document.getElementById("check_" + i).checked;
    if(!checked) continue;

    const nameValue = document.getElementById("name_" + i).value.trim();
    const weightValue = Number(document.getElementById("weight_" + i).value);

    arr.push({
      number:i,
      name:nameValue || String(i),
      weight:weightValue > 0 ? weightValue : 1
    });
  }

  return arr;
}

function draw(){
  const candidates = getCandidates();

  if(candidates.length === 0){
    alert("請至少勾選一個號碼。");
    return;
  }

  const totalWeight = candidates.reduce((sum,x)=>sum+x.weight,0);
  let r = Math.random() * totalWeight;
  let winner = candidates[0];

  for(const item of candidates){
    r -= item.weight;
    if(r <= 0){
      winner = item;
      break;
    }
  }

  const wheel = document.getElementById("wheel");
  const result = document.getElementById("result");

  result.textContent = "轉盤轉動中...";

  rotation += 1440 + Math.floor(Math.random() * 1080);
  wheel.style.transform = `rotate(${rotation}deg)`;

  setTimeout(()=>{
    result.innerHTML = `🎉 中獎<br>${escapeHtml(winner.name)}<br><span class="small">號碼：${winner.number}｜權重：${winner.weight}</span>`;

    addRecord(winner,candidates);

    if(removeWinnerAfterDraw){
      document.getElementById("check_" + winner.number).checked = false;
      updateItem(winner.number);
    }
  },3600);
}

function addRecord(winner,candidates){
  const records = getRecords();
  const now = new Date();
  const time = now.toLocaleString("zh-TW",{hour12:false});
  const totalWeight = candidates.reduce((sum,x)=>sum+x.weight,0);
  const rate = ((winner.weight / totalWeight) * 100).toFixed(2);

  records.unshift({
    time,
    number:winner.number,
    name:winner.name,
    weight:winner.weight,
    rate
  });

  localStorage.setItem(STORAGE_KEY,JSON.stringify(records));
  renderRecords();
}

function getRecords(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  }catch(e){
    return [];
  }
}

function loadRecords(){
  renderRecords();
}

function renderRecords(){
  const records = getRecords();
  const box = document.getElementById("records");

  if(records.length === 0){
    box.textContent = "尚無中獎紀錄";
    return;
  }

  box.textContent = records.map((r,i)=>{
    return `${i+1}. ${r.time}
中獎：${r.name}
號碼：${r.number}
權重：${r.weight}
本次約略機率：${r.rate}%`;
  }).join("\n\n");
}

function clearRecords(){
  if(!confirm("確定要清除中獎紀錄嗎？")) return;
  localStorage.removeItem(STORAGE_KEY);
  renderRecords();
}

function selectAll(){
  for(let i=1;i<=TOTAL;i++){
    document.getElementById("check_" + i).checked = true;
    updateItem(i);
  }
}

function unselectAll(){
  for(let i=1;i<=TOTAL;i++){
    document.getElementById("check_" + i).checked = false;
    updateItem(i);
  }
}

function resetNames(){
  if(!confirm("確定要清空全部名稱嗎？")) return;
  for(let i=1;i<=TOTAL;i++){
    document.getElementById("name_" + i).value = "";
  }
}

function resetWeights(){
  if(!confirm("確定要把全部權重重設為 1 嗎？")) return;
  for(let i=1;i<=TOTAL;i++){
    document.getElementById("weight_" + i).value = "";
  }
}

function removeWinnerToggle(){
  removeWinnerAfterDraw = !removeWinnerAfterDraw;
  document.getElementById("removeText").textContent =
    removeWinnerAfterDraw ? "中獎後自動取消勾選" : "中獎後保留名單";
}

function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

init();
</script>

</body>
</html>
